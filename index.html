<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>언니의 이상형 찾기 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Moirai+One&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF0F4;
    --card: #FFFFFF;
    --pink: #E8537A;
    --pink-soft: #F4A0B8;
    --pink-pale: #FDE8EE;
    --pink-border: #F9C5D5;
    --text: #1A1018;
    --text-sub: #9B6678;
    --text-hint: #C9A0AF;
    --accent: #D63F68;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Bagel Fat One', cursive;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(var(--pink-border) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .site-header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeDown 0.7s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes fadeDown {
    from { transform: translateY(-16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .pill-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--pink-pale);
    border: 1px solid var(--pink-border);
    color: var(--pink);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 1.2rem;
  }

  .site-title {
    font-family: 'Moirai One', cursive;
    font-size: 2.8rem;
    color: var(--text);
    line-height: 1.05;
    margin-bottom: 0.6rem;
    letter-spacing: -0.02em;
  }

  .site-title em {
    font-style: italic;
    color: var(--pink);
  }

  .site-subtitle {
    font-size: 0.9rem;
    color: var(--text-sub);
    font-weight: 400;
  }

  .progress-area { margin-bottom: 2rem; }

  .progress-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .progress-step {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: 0.06em;
  }

  .progress-pct {
    font-size: 0.75rem;
    color: var(--text-hint);
  }

  .progress-track {
    height: 3px;
    background: var(--pink-border);
    border-radius: 999px;
    overflow: visible;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--pink);
    border-radius: 999px;
    transition: width 0.5s cubic-bezier(.22,1,.36,1);
    position: relative;
  }

  .progress-dot {
    position: absolute;
    right: -5px; top: 50%;
    transform: translateY(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--pink);
    border: 2px solid white;
    box-shadow: 0 0 0 2px var(--pink-soft);
  }

  .q-card {
    background: var(--card);
    border-radius: 20px;
    padding: 2rem 2rem 1.75rem;
    border: 1px solid var(--pink-border);
    margin-bottom: 1.25rem;
    animation: slideUp 0.45s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes slideUp {
    from { transform: translateY(18px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .q-eyebrow {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pink-soft);
    margin-bottom: 0.6rem;
  }

  .q-text {
    font-family: 'Moirai One', cursive;
    font-size: 1.35rem;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 1.75rem;
    letter-spacing: -0.01em;
  }

  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .opts.col1 { grid-template-columns: 1fr; }

  .opt {
    background: var(--pink-pale);
    border: 1.5px solid var(--pink-border);
    border-radius: 12px;
    padding: 0.7rem 0.9rem;
    font-family: 'Bagel Fat One', cursive;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    line-height: 1.4;
  }

  .opt:hover { border-color: var(--pink-soft); background: #fce4ec; }

  .opt.on {
    background: var(--pink);
    border-color: var(--accent);
    color: white;
  }

  .opt.on::after {
    float: right;
    content: '✓';
    font-size: 0.75rem;
    opacity: 0.85;
    margin-left: 6px;
  }

  .multi-hint {
    font-size: 0.75rem;
    color: var(--text-hint);
    margin-bottom: 0.75rem;
  }

  .slider-val {
    text-align: center;
    font-family: 'Moirai One', cursive;
    font-size: 2.4rem;
    color: var(--pink);
    margin-bottom: 0.75rem;
    letter-spacing: -0.02em;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--pink) var(--pct,50%), var(--pink-border) var(--pct,50%));
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--pink);
    border: 3px solid white;
    box-shadow: 0 1px 6px rgba(232,83,122,0.35);
  }

  .slider-ends {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-hint);
    margin-top: 8px;
  }

  .q-textarea {
    width: 100%;
    border: 1.5px solid var(--pink-border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    font-family: 'Bagel Fat One', cursive;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--pink-pale);
    resize: none;
    outline: none;
    min-height: 90px;
    transition: border-color 0.2s;
    line-height: 1.6;
  }
  .q-textarea::placeholder { color: var(--text-hint); }
  .q-textarea:focus { border-color: var(--pink-soft); background: white; }

  .nav { display: flex; gap: 10px; }

  .btn-back {
    background: white;
    border: 1.5px solid var(--pink-border);
    border-radius: 12px;
    padding: 0 1.25rem;
    font-family: 'Bagel Fat One', cursive;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.18s;
    height: 48px;
  }
  .btn-back:hover { background: var(--pink-pale); }

  .btn-fwd {
    flex: 1;
    background: var(--pink);
    border: none;
    border-radius: 12px;
    height: 48px;
    font-family: 'Bagel Fat One', cursive;
    font-size: 0.92rem;
    font-weight: 600;
    color: white;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.18s;
  }
  .btn-fwd:hover { background: var(--accent); }
  .btn-fwd:active { transform: scale(0.98); }

  .result-wrap { display: none; animation: slideUp 0.5s cubic-bezier(.22,1,.36,1) both; }

  .result-hero {
    text-align: center;
    margin-bottom: 2rem;
  }

  .result-emoji { font-size: 2.5rem; margin-bottom: 0.5rem; }

  .result-hero h2 {
    font-family: 'Moirai One', cursive;
    font-size: 2rem;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 0.3rem;
  }

  .result-hero p { font-size: 0.85rem; color: var(--text-sub); }

  .result-block {
    background: white;
    border: 1px solid var(--pink-border);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .result-block-title {
    background: var(--pink-pale);
    padding: 0.65rem 1.25rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-sub);
    border-bottom: 1px solid var(--pink-border);
  }

  .result-rows { padding: 0.5rem 1.25rem; }

  .result-row {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px dashed var(--pink-border);
    font-size: 0.875rem;
  }
  .result-row:last-child { border-bottom: none; }

  .r-label {
    color: var(--text-hint);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    flex: 0 0 80px;
    padding-top: 1px;
  }

  .r-val {
    color: var(--text);
    font-weight: 500;
    flex: 1;
    line-height: 1.5;
  }

  .r-tag {
    display: inline-block;
    background: var(--pink-pale);
    border: 1px solid var(--pink-border);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.78rem;
    color: var(--text-sub);
    margin: 2px 3px 2px 0;
    font-weight: 500;
  }

  .letter-box {
    background: var(--pink-pale);
    border: 1px solid var(--pink-border);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    margin: 1rem 0;
    font-family: 'Moirai One', cursive;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--text);
    line-height: 1.6;
  }

  .btn-restart {
    width: 100%;
    background: var(--pink);
    border: none;
    border-radius: 14px;
    padding: 0.95rem;
    font-family: 'Bagel Fat One', cursive;
    font-size: 0.92rem;
    font-weight: 600;
    color: white;
    cursor: pointer;
    margin-top: 1.5rem;
    letter-spacing: 0.02em;
    transition: background 0.18s;
  }
  .btn-restart:hover { background: var(--accent); }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="wrapper">
  <header class="site-header">
    <div class="pill-tag">💌 ideal type quiz</div>
    <h1 class="site-title">언니의<br><em>이상형은?</em></h1>
    <p class="site-subtitle">솔직하게 눌러봐 — 아무도 안 봐 (나만 봄)</p>
  </header>

  <div id="quiz">
    <div class="progress-area">
      <div class="progress-top">
        <span class="progress-step" id="step-label">01 / 15</span>
        <span class="progress-pct" id="pct-label">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill" style="width:0%">
          <div class="progress-dot"></div>
        </div>
      </div>
    </div>

    <div class="q-card" id="q-card"></div>

    <div class="nav">
      <button class="btn-back" id="btn-back" onclick="prev()">←</button>
      <button class="btn-fwd" id="btn-fwd" onclick="next()">다음</button>
    </div>
  </div>

  <div class="result-wrap" id="result">
    <div class="result-hero">
      <div class="result-emoji">🎀</div>
      <h2>이상형 완성</h2>
      <p>이런 사람이 실존한다면 인류의 기적</p>
    </div>

    <div class="result-block">
      <div class="result-block-title">🌸 기본 스펙</div>
      <div class="result-rows" id="r-basic"></div>
    </div>

    <div class="result-block">
      <div class="result-block-title">💬 연애 스타일</div>
      <div class="result-rows" id="r-love"></div>
    </div>

    <div class="result-block">
      <div class="result-block-title">🚫 비호감 요소</div>
      <div class="result-rows" id="r-deal"></div>
    </div>

    <div id="r-letter"></div>
    <button class="btn-restart" onclick="restart()">↺ 다시 하기</button>
  </div>
</div>

<script>
const Qs = [
  { id:'age', q:'연상, 동갑, 연하 — 어떤 사람이 좋아?', type:'single', col:1,
    opts:['연상', '동갑', '연하', '상관없어'] },
  { id:'height', q:'이상적인 키는?', type:'slider', min:150, max:175, def:163, unit:'cm' },
  { id:'face_type', q:'선호하는 얼굴상은?', type:'single',
    opts:['토끼상 🐰','다람쥐상 🐿️','사슴상 🦌','강아지상 🐶','고양이상 🐱','여우상 🦊','곰상 🐻','상관없어'] },
  { id:'style', q:'선호하는 외모 스타일은?', type:'single',
    opts:['깔끔한 정장형 🧥','캐주얼 보이시 👟','꾸안꾸 감성 🧣','아이돌 느낌 ✨'] },
  { id:'body', q:'체형은?', type:'single', col:1,
    opts:['슬림','슬림 + 근육','평균 건강체형','든든한 편','상관없어'] },
  { id:'date', q:'첫 데이트 장소는?', type:'single',
    opts:['카페 ☕','레스토랑 🍝','전시/미술관 🎨','한강 피크닉 🌸','영화관 🎬','놀이공원 🎡'] },
  { id:'contact', q:'연락 스타일은?', type:'single', col:1,
    opts:['하루종일 붙어있는 편','자주, 근데 적당히','필요할 때만','상황봐서'] },
  { id:'mbti', q:'MBTI 선호가 있어?', type:'multi',
    opts:['E','I','N','S','T','F','J','P','상관없어'] },
  { id:'voice', q:'목소리 톤은?', type:'single', col:1,
    opts:['낮고 차분한 편','보통','높고 밝은 편','말투가 더 중요해'] },
  { id:'alcohol', q:'음주는?', type:'single', col:1,
    opts:['둘 다 안 마셨으면','가볍게 한두 잔','같이 신나게 마실 수 있으면','상관없어'] },
  { id:'hobby', q:'취미가 비슷한 게 중요해?', type:'single', col:1,
    opts:['매우 중요','조금은 겹치면 좋겠어','달라도 서로 존중하면 OK','전혀 상관없어'] },
  { id:'fight', q:'싸웠을 때 어떻게 푸는 사람이 좋아?', type:'single', col:1,
    opts:['바로 사과하고 안아줘 🫂','시간 갖고 나서 대화해 ⏳','차분하게 논리적으로 🗣️','먼저 웃으면서 풀어줘 😊','밥 사주면서 무마해 🍜'] },
  { id:'lead', q:'연애 주도권은?', type:'single', col:1,
    opts:['리드해주는 사람이 좋아','같이 맞춰나가는 스타일','내가 리드하는 편','상황마다 달라'] },
  { id:'dealbreak', q:'이건 절대 NO', type:'multi',
    opts:['거짓말 🤥','연락 두절 📵','게임 과몰입 🎮','과도한 음주 🍺','전 연인 얘기 🙅','불성실한 생활패턴 😴','집착 👀','감정 표현 없음 🧊','패션 테러 👔','자기 얘기만 해 🗣️'] },
  { id:'letter', q:'이상형을 한 줄로 설명한다면?', type:'text',
    ph:'예) 눈 마주치면 심장이 쿵 하는 사람 …' }
];

const LABELS = {
  age:'나이', height:'키', face_type:'얼굴상', style:'스타일', body:'체형',
  date:'첫 데이트', contact:'연락', mbti:'MBTI', voice:'목소리',
  alcohol:'음주', hobby:'취미', fight:'갈등 해결', lead:'주도권',
  dealbreak:'비호감', letter:'한 줄'
};

let cur = 0, ans = {};

function render() {
  const q = Qs[cur];
  const pct = Math.round((cur / Qs.length) * 100);
  document.getElementById('step-label').textContent =
    String(cur+1).padStart(2,'0') + ' / ' + String(Qs.length).padStart(2,'0');
  document.getElementById('pct-label').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';

  let h = `<div class="q-eyebrow">Q ${cur+1}</div>`;
  h += `<div class="q-text">${q.q}</div>`;

  if (q.type === 'single') {
    h += `<div class="opts ${q.col===1?'col1':''}">`;
    q.opts.forEach((o,i) => {
      h += `<button class="opt ${ans[q.id]===o?'on':''}" onclick="pick('${q.id}',this,${i})">${o}</button>`;
    });
    h += '</div>';
  } else if (q.type === 'multi') {
    h += `<p class="multi-hint">여러 개 선택할 수 있어</p><div class="opts">`;
    (ans[q.id]||[]);
    q.opts.forEach(o => {
      const on = (ans[q.id]||[]).includes(o) ? 'on' : '';
      h += `<button class="opt ${on}" onclick="toggle('${q.id}',\`${o}\`,this)">${o}</button>`;
    });
    h += '</div>';
  } else if (q.type === 'slider') {
    const v = ans[q.id] !== undefined ? ans[q.id] : q.def;
    const p = ((v-q.min)/(q.max-q.min)*100).toFixed(1);
    h += `<div class="slider-val" id="sv">${v}${q.unit}</div>
    <input type="range" min="${q.min}" max="${q.max}" value="${v}" step="1" style="--pct:${p}%"
      oninput="slide(this,'${q.id}',${q.min},${q.max},'${q.unit}')">
    <div class="slider-ends"><span>${q.min}${q.unit}</span><span>${q.max}${q.unit}</span></div>`;
    ans[q.id] = v;
  } else {
    h += `<textarea class="q-textarea" placeholder="${q.ph}" oninput="ans['${q.id}']=this.value">${ans[q.id]||''}</textarea>`;
  }

  const card = document.getElementById('q-card');
  card.innerHTML = h;
  card.style.animation = 'none';
  requestAnimationFrame(() => card.style.animation = '');

  document.getElementById('btn-back').style.visibility = cur===0 ? 'hidden' : 'visible';
  document.getElementById('btn-fwd').textContent = cur===Qs.length-1 ? '결과 보기 💌' : '다음';
}

function pick(id, el, i) {
  ans[id] = Qs[cur].opts[i];
  document.querySelectorAll('.opt').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}

function toggle(id, val, el) {
  if (!ans[id]) ans[id] = [];
  const i = ans[id].indexOf(val);
  if (i===-1) { ans[id].push(val); el.classList.add('on'); }
  else { ans[id].splice(i,1); el.classList.remove('on'); }
}

function slide(el, id, min, max, unit) {
  const v = +el.value;
  ans[id] = v;
  document.getElementById('sv').textContent = v+unit;
  el.style.setProperty('--pct', ((v-min)/(max-min)*100)+'%');
}

function next() {
  const q = Qs[cur];
  if (q.type!=='slider' && q.type!=='text' && !ans[q.id]) {
    const card = document.getElementById('q-card');
    card.style.outline = '2px solid var(--pink)';
    setTimeout(()=>card.style.outline='', 500);
    return;
  }
  if (cur < Qs.length-1) { cur++; render(); }
  else showResult();
}

function prev() { if (cur>0) { cur--; render(); } }

function row(id) {
  const v = ans[id];
  if (!v && v!==0) return '';
  let d = Array.isArray(v) ? v.map(x=>`<span class="r-tag">${x}</span>`).join('') :
          typeof v==='number' ? v+'cm' : v;
  return `<div class="result-row"><span class="r-label">${LABELS[id]}</span><span class="r-val">${d}</span></div>`;
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('r-basic').innerHTML = row('age')+row('height')+row('face_type')+row('style')+row('body');
  document.getElementById('r-love').innerHTML = row('date')+row('contact')+row('mbti')+row('voice')+row('alcohol')+row('hobby')+row('fight')+row('lead');
  document.getElementById('r-deal').innerHTML = row('dealbreak');
  document.getElementById('r-letter').innerHTML = ans['letter'] ? `<div class="letter-box">"${ans['letter']}"</div>` : '';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('pct-label').textContent = '100%';
  boom();
}

function restart() {
  cur=0; ans={};
  document.getElementById('quiz').style.display='block';
  document.getElementById('result').style.display='none';
  render();
}

function boom() {
  const c = document.getElementById('confetti');
  const ctx = c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const cols = ['#E8537A','#F4A0B8','#C084FC','#FFD6E7','#FBBF24','#A7F3D0'];
  const bits = Array.from({length:80}, ()=>({
    x: Math.random()*c.width, y:-10,
    r: Math.random()*7+3, spd: Math.random()*1.8+0.8,
    col: cols[Math.floor(Math.random()*cols.length)],
    ang:0, spin:(Math.random()-.5)*.08
  }));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.ang);
      ctx.fillStyle=b.col; ctx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2);
      ctx.restore();
      b.y+=b.spd; b.ang+=b.spin; b.x+=Math.sin(b.ang)*1.2;
    });
    if(++f<220) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}

render();
</script>
